<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Unmatched is a question, not a verdict</title><desc id="desc">Check a radar candidate for artifacts, then check AIS coverage, timing and identity uncertainty before seeking corroborating evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#839eaa"/></marker></defs>
<rect width="1100" height="540" rx="18" fill="#081f32"/>
<text x="38" y="50" fill="white" font-size="27" font-family="Arial,sans-serif" font-weight="700">Unmatched is a question, not a verdict</text>
<path d="M340.0 155.0L400.0 155.0" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<path d="M700.0 155.0L760.0 155.0" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<path d="M782.258064516129 210.0L503.54838709677415 330.0" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<path d="M520.0 387.5L620.0 387.5" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="300" height="110" rx="10" fill="#15364a" stroke="#27c7b8" stroke-width="2"/>
<text x="56" y="130" fill="#27c7b8" font-size="19" font-family="Arial,sans-serif" font-weight="700">Radar candidate</text>
<text x="56" y="156" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Vessel, clutter or structure?</text>
<text x="56" y="176" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Review the image and masks</text>
<rect x="400" y="100" width="300" height="110" rx="10" fill="#15364a" stroke="#27c7b8" stroke-width="2"/>
<text x="416" y="130" fill="#27c7b8" font-size="19" font-family="Arial,sans-serif" font-weight="700">Coverage check</text>
<text x="416" y="156" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Was AIS reasonably receivable?</text>
<text x="416" y="176" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Check time and data availability</text>
<rect x="760" y="100" width="300" height="110" rx="10" fill="#15364a" stroke="#27c7b8" stroke-width="2"/>
<text x="776" y="130" fill="#27c7b8" font-size="19" font-family="Arial,sans-serif" font-weight="700">Matching check</text>
<text x="776" y="156" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Motion, timing, location error</text>
<text x="776" y="176" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">One-to-one identity assignment</text>
<rect x="220" y="330" width="300" height="115" rx="10" fill="#15364a" stroke="#ffc66a" stroke-width="2"/>
<text x="236" y="360" fill="#ffc66a" font-size="19" font-family="Arial,sans-serif" font-weight="700">Still unmatched?</text>
<text x="236" y="386" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Equipment, carriage, reception,</text>
<text x="236" y="406" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">or deliberate concealment?</text>
<rect x="620" y="330" width="300" height="115" rx="10" fill="#15364a" stroke="#ffc66a" stroke-width="2"/>
<text x="636" y="360" fill="#ffc66a" font-size="19" font-family="Arial,sans-serif" font-weight="700">Corroborate</text>
<text x="636" y="386" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Registries, authorizations, logs</text>
<text x="636" y="406" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">No automatic illegality claim</text>
<text x="38" y="520" fill="#a6bfcb" font-size="13" font-family="Arial,sans-serif">Conceptual teaching diagram · arrows describe reasoning or possible pathways, not measured causal effects.</text></svg>