<rect x="40" y="105" width="290" height="115" rx="10" fill="#15364a" stroke="#27c7b8" stroke-width="2"/>
<text x="56" y="135" fill="#27c7b8" font-size="19" font-family="Arial,sans-serif" font-weight="700">Marine ecosystems</text>
<text x="56" y="161" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Stocks, habitats, biodiversity</text>
<text x="56" y="181" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Growth, bycatch, resilience</text>
<rect x="405" y="105" width="290" height="115" rx="10" fill="#15364a" stroke="#27c7b8" stroke-width="2"/>
<text x="421" y="135" fill="#27c7b8" font-size="19" font-family="Arial,sans-serif" font-weight="700">Aquatic food systems</text>
<text x="421" y="161" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Landings, trade, loss, prices</text>
<text x="421" y="181" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Access and working conditions</text>
<rect x="770" y="105" width="290" height="115" rx="10" fill="#15364a" stroke="#27c7b8" stroke-width="2"/>
<text x="786" y="135" fill="#27c7b8" font-size="19" font-family="Arial,sans-serif" font-weight="700">People and communities</text>
<text x="786" y="161" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Nutrition, income, well-being</text>
<text x="786" y="181" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Intake is not availability</text>
<rect x="40" y="325" width="290" height="115" rx="10" fill="#15364a" stroke="#ffc66a" stroke-width="2"/>
<text x="56" y="355" fill="#ffc66a" font-size="19" font-family="Arial,sans-serif" font-weight="700">Environmental pressures</text>
<text x="56" y="381" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Warming, pollution, runoff</text>
<text x="56" y="401" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Hazards need direct evidence</text>
<rect x="405" y="325" width="290" height="115" rx="10" fill="#15364a" stroke="#ffc66a" stroke-width="2"/>
<text x="421" y="355" fill="#ffc66a" font-size="19" font-family="Arial,sans-serif" font-weight="700">Exposure pathways</text>
<text x="421" y="381" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Seafood, water contact, work</text>
<text x="421" y="401" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Dose, timing, susceptibility</text>
<rect x="770" y="325" width="290" height="115" rx="10" fill="#15364a" stroke="#ffc66a" stroke-width="2"/>
<text x="786" y="355" fill="#ffc66a" font-size="19" font-family="Arial,sans-serif" font-weight="700">Shared response</text>
<text x="786" y="381" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Co-management + monitoring</text>
<text x="786" y="401" fill="#e1ebee" font-size="15" font-family="Arial,sans-serif">Health and ecological outcomes</text>
<text x="38" y="520" fill="#a6bfcb" font-size="13" font-family="Arial,sans-serif">Conceptual teaching diagram · arrows describe reasoning or possible pathways, not measured causal effects.</text></svg>