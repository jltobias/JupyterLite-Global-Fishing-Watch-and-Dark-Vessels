<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">One ocean · connected health</title><desc id="desc">Marine ecosystems support aquatic food and livelihoods; environmental change can affect ecosystems and exposure. Distribution, governance and measurement connect these to population health.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#839eaa"/></marker></defs>
<rect width="1100" height="540" rx="18" fill="#081f32"/>
<text x="38" y="50" fill="white" font-size="27" font-family="Arial,sans-serif" font-weight="700">One ocean · connected health</text>
<path d="M330.0 162.5L405.0 162.5" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<path d="M695.0 162.5L770.0 162.5" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
