<path d="M330.0 382.5L405.0 382.5" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<path d="M645.3977272727273 325.0L819.6022727272727 220.0" stroke="#839eaa" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
